<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <title data-l10n-id="zotcloud-conflict-title"></title>
  <link rel="localization" href="zotcloud/zotcloud.ftl" />
  <style>
    .zotcloud-conflict { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; padding: 16px; }
    .zotcloud-conflict-box { background: #faeeda; border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; }
    .zotcloud-conflict-label { font-size: 11px; color: #854f0b; font-weight: 500; margin-bottom: 6px; }
    .zotcloud-conflict-version { font-size: 11px; margin-bottom: 4px; }
    .zotcloud-conflict-device { color: #6b6b6b; }
    .zotcloud-conflict-actions { display: flex; gap: 8px; margin-bottom: 16px; }
    .zotcloud-conflict-actions button { flex: 1; font-size: 11px; padding: 5px 8px; border: 1px solid #c0c0b8; border-radius: 4px; background: transparent; cursor: pointer; }
    .zotcloud-conflict-actions button.primary { background: #e6f1fb; color: #185fa5; border-color: #378add; }
  </style>
</head>
<body>
  <div class="zotcloud-conflict">
    <div id="zotcloud-conflict-root"></div>
  </div>
</body>
</html>
